<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ведомости по проходам сотрудников PERCo">
  <title>Производство · Учёт времени</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar"><div class="wrap topbar-inner"><div class="brand-icon" aria-hidden="true"><span></span><span></span><span></span></div><div class="brand-copy"><strong>ПРОИЗВОДСТВО</strong><small>Учёт времени · PERCo</small></div><div class="topbar-status"><i></i> Локальный отчёт</div></div></header>
  <main class="wrap">
    <section class="masthead"><div><div class="eyebrow">УЧЁТ ПРОХОДОВ / ВЕДОМОСТИ</div><h1>Рабочее время<br><em>по участкам</em></h1><p>Загрузи выгрузку PERCo и выбери период.</p></div><div class="pipe-photo" role="img" aria-label="Предизолированные трубы с пенополиуретановой изоляцией"></div></section>
    <section class="toolbar" aria-label="Исходные данные и параметры">
      <div class="upload-grid">
        <div class="file-control"><label class="upload-button" for="files">Проходы PERCo</label><input id="files" type="file" accept=".xlsx,.xls" multiple><span id="file-list" class="file-list" aria-live="polite">Файл не выбран</span></div>
        <div class="file-control"><label class="upload-button" for="schedule-file">Месячные графики</label><input id="schedule-file" type="file" accept=".xlsx,.xls" multiple><span id="schedule-label" class="file-list" aria-live="polite">Файлы не выбраны</span></div>
        <div class="file-control"><label class="upload-button" for="presence-file">Сводка с графиками K</label><input id="presence-file" type="file" accept=".xlsx,.xls"><span id="presence-label" class="file-list" aria-live="polite">Файл не выбран</span></div>
      </div><button id="clear-data" type="button" class="text-button" hidden>Очистить все файлы</button>
      <div id="workspace" hidden>
        <div class="filter-row"><label>С даты<input id="from-date" type="date"></label><label>По дату<input id="to-date" type="date"></label><label>Сортировка<select id="sort"><option value="name">По фамилии</option><option value="date-asc">По дате ↑</option><option value="date-desc">По дате ↓</option></select></label><button id="calculate" type="button" class="primary">Показать</button><button id="export-all" type="button" class="export-button">↓ Скачать Excel</button></div>
        <div id="summary" class="summary" aria-live="polite"></div>
        <section class="results" aria-labelledby="results-title"><div class="section-heading"><div><div class="eyebrow">РЕЗУЛЬТАТ</div><h2 id="results-title">Ведомости</h2></div><div class="tabs" role="tablist" aria-label="Ведомости"><button class="tab active" type="button" role="tab" aria-selected="true" data-tab="plant">Подробные проходы</button><button class="tab" type="button" role="tab" aria-selected="false" data-tab="presence">Сводка PERCo</button></div></div>
          <div class="table-card" data-panel="plant"><div class="table-scroll"><table id="plant-table" class="attendance-table"></table></div></div>
          <div class="table-card" data-panel="presence" hidden><div class="table-scroll"><table id="presence-table" class="attendance-table"></table></div></div>
        </section>
      </div>
    </section>
    <div id="notice" class="notice" role="status" aria-live="polite"></div>
  </main>
  <script src="vendor/jszip.min.js"></script>
  <script src="vendor/xlsx.full.min.js"></script>
  <script type="module" src="app.mjs"></script>
</body>
</html>
